[Camera0]
device=/dev/video11
width=1920
height=1080
streamUrl=rtsp://127.0.0.1:8554/live/cam0
recordResolution=1080

[Camera1]
device=/dev/video21
width=1920
height=1080
streamUrl=rtsp://127.0.0.1:8554/live/cam1
recordResolution=1080

[WebServer]
enabled=true
port=8080

[Record]
dir=/mnt/sdcard

[Lidar]
device=/dev/sentinel_lidar
baudRate=460800
hz=10
minRange=0.15
maxRange=50.0
angleDisableMin=0
angleDisableMax=0

[Fusion]
enabled=false
camCount=2
modelPath=./models/yolov8n.rknn
dbscanEpsMeters=0.35
dbscanMinPoints=7
maxPointDistanceMeters=30.0
maxClusterDistanceMeters=10.0
clusterPersistenceFrames=2
alpha=0.45
beta=0.2
minHitsForVelocity=2
bboxAssocMaxDistMeters=0.75
orphanAssocMaxDistMeters=0.5
bboxClaimMaxPixelDist=100.0
minBboxClaimPoints=10
minHitsToConfirm=3
maxTentativeMisses=1
maxFusionMisses=2
maxLostFrames=20
maxTracks=50
warningEnterDistMeters=0.5
warningExitDistMeters=0.6
minConfirmedAgeForWarning=2
warningCooldownNs=2000000000
clusterVisOpacity=0.3
radarRangeMeters=5.0
Cam0Fx=406
Cam0Fy=406
Cam0Cx=320
Cam0Cy=320
Cam0ImgWidth=640
Cam0ImgHeight=640
Cam0T0=-1.0
Cam0T1=0.0
Cam0T2=0.0
Cam0T3=0.0
Cam0T4=0.0
Cam0T5=0.0
Cam0T6=-1.0
Cam0T7=-0.07795
Cam0T8=0.0
Cam0T9=-1.0
Cam0T10=0.0
Cam0T11=-0.102
Cam0T12=0.0
Cam0T13=0.0
Cam0T14=0.0
Cam0T15=1.0
Cam1Fx=362.2418
Cam1Fy=362.2418
Cam1Cx=309.3131
Cam1Cy=315.9068
Cam1ImgWidth=640
Cam1ImgHeight=640
Cam1T0=-1.0
Cam1T1=0.0
Cam1T2=0.0
Cam1T3=0.0
Cam1T4=0.0
Cam1T5=0.0
Cam1T6=-1.0
Cam1T7=-0.07795
Cam1T8=0.0
Cam1T9=1.0
Cam1T10=0.0
Cam1T11=0.102
Cam1T12=0.0
Cam1T13=0.0
Cam1T14=0.0
Cam1T15=1.0

[Backtrack]
enabled=true
ringBufferSlots=150
maxBacktrackSeconds=5.0
backtrackDir=/mnt/sdcard/backtrack
nvmeDevice=/dev/nvme0n1

[EIS]
# 防抖方案：视觉为主 + IMU辅助。
# 视觉侧在 sentinel-visioner 采集线程中使用 LK 光流估计画面 dx/dy/dtheta；
# IMU 侧只提供 gyroRms / vibrationLevel，用于动态调整轨迹平滑强度。
enabled=false
showEisControl=true

# IMU辅助配置：一个 ICM45686 全局只有一套 sampleHz/gyroRange/accelRange。
device=/dev/icm45686
sampleHz=100
gyroRange=0
accelRange=0
imuAssistWindowMs=200

# 录像调试：由 streamer 决定是否保存 raw/eis 双路对比。
streamerMargin=45
eisRecordDebug=false

# Camera0 视觉EIS参数
Cam0ProcessWidth=640
Cam0ProcessHeight=360
Cam0MaxCorners=500
Cam0QualityLevel=0.01
Cam0MinDistance=10.0
Cam0MinTrackedPoints=30
Cam0MinInliers=20
Cam0RansacThreshold=3.0
Cam0MaxOpticalFlow=80.0
Cam0MaxOffsetPixel=80
Cam0EnableImuAdaptiveAlpha=true
Cam0AlphaLow=0.30
Cam0AlphaMid=0.20
Cam0AlphaHigh=0.12
Cam0EnableRotationEstimate=true

# Camera1 视觉EIS参数
Cam1ProcessWidth=640
Cam1ProcessHeight=360
Cam1MaxCorners=500
Cam1QualityLevel=0.01
Cam1MinDistance=10.0
Cam1MinTrackedPoints=30
Cam1MinInliers=20
Cam1RansacThreshold=3.0
Cam1MaxOpticalFlow=80.0
Cam1MaxOffsetPixel=80
Cam1EnableImuAdaptiveAlpha=true
Cam1AlphaLow=0.30
Cam1AlphaMid=0.20
Cam1AlphaHigh=0.12
Cam1EnableRotationEstimate=true
