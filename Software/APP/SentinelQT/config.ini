[EIS]
# 防抖方案：IMU-only 电子防抖退化版。
# IMU gyro -> R_B_imu_raw -> qRaw_B/qSmooth_B -> R_delta_C -> H = K R K^-1
# 当前仍输出 offsetX/offsetY 给 RGA crop 使用；后续可升级为真正 H warp。
enabled=false
showEisControl=true

# IMU配置：一个 ICM45686 全局只有一套 sampleHz/gyroRange/accelRange。
device=/dev/icm45686
sampleHz=100
gyroRange=0
accelRange=0
imuAssistWindowMs=200

# 录像调试：由 streamer 决定是否保存 raw/eis 双路对比。
streamerMargin=45
eisRecordDebug=false

# IMU raw -> B 坐标映射，用户实测：
# gyro_B.x=-gyro_raw.y, gyro_B.y=-gyro_raw.x, gyro_B.z=gyro_raw.z
Cam0RBimu00=0
Cam0RBimu01=-1
Cam0RBimu02=0
Cam0RBimu10=-1
Cam0RBimu11=0
Cam0RBimu12=0
Cam0RBimu20=0
Cam0RBimu21=0
Cam0RBimu22=1
Cam1RBimu00=0
Cam1RBimu01=-1
Cam1RBimu02=0
Cam1RBimu10=-1
Cam1RBimu11=0
Cam1RBimu12=0
Cam1RBimu20=0
Cam1RBimu21=0
Cam1RBimu22=1

# Camera0 IMU-only EIS 参数：cam0 光轴向左，IMU->cam0 光心约 (-17.5cm, 0, +7cm)
